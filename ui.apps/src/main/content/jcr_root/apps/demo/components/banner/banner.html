<div class="shopkart-banner"
     style="position: relative; min-height: 400px; overflow: hidden; background-color: #f3eee6;">
    <img
        data-sly-test="${properties.bannerImage}"
        src="${properties.bannerImage}"
        alt="${properties.heading}"
        style="position: absolute; width: 100%; height: 100%; object-fit: cover; inset: 0;"/>

    <div style="position: relative; z-index: 1; padding: 60px 40px; max-width: 550px;">

        <h1 style="font-size: 42px; color: #222222; margin-bottom: 16px;">
            ${properties.heading}
        </h1>

        <p style="font-size: 18px; color: #333333; line-height: 1.6;">
            ${properties.description}
        </p>

        <a data-sly-test="${properties.buttonText}"
           href="${properties.buttonLink}"
           style="display: inline-block; margin-top: 20px; background: #1565c0; color: white; padding: 14px 24px; text-decoration: none; border-radius: 4px;">
            ${properties.buttonText}
        </a>

    </div>
</div>
