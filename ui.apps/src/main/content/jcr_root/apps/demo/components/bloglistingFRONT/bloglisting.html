<!-- Load CSS Client Library -->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='demo.bloglisting'}"/>

<div class="blog-listing-container">

    <h2 class="blog-heading">Latest Blogs</h2>

    <!-- Loading message -->
    <p class="blog-loading">Loading blogs...</p>

    <!-- Error message -->
    <p class="blog-error" hidden>
        Unable to load blog data. Please try again.
    </p>

    <!-- Blog data will be displayed here -->
    <div class="blog-listing-grid"></div>

</div>

<!-- Load JavaScript Client Library -->
<sly data-sly-call="${clientlib.js @ categories='demo.bloglisting'}"/>
